<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TPF2 CTC 调度台原型</title>
    <link rel="stylesheet" href="network.css?v=20260930-official-palette1">
</head>
<body>
    <header>
        <div class="brand"><b>TPF2</b> // CTC DISPATCH</div>
        <div class="sep"></div>
        <div class="station" id="station-name">—</div>
        <div class="meta" id="snapshot">—</div>
        <div class="spacer"></div>
        <div class="mode">LOCAL CONTROL · STATIC</div>
        <div class="clock">00:00:00</div>
    </header>
    <div class="workspace">
        <nav>
            <button class="active">站场图</button>
            <button id="timetable-view">运行图</button>
            <button>线路</button>
            <button>车辆</button>
            <button>告警</button>
            <button>设置</button>
        </nav>
        <section id="board-wrap">
            <svg id="board" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet"></svg>
            <div class="track-tooltip" id="track-tooltip"></div>
            <div class="map-notice" id="map-notice" role="status" aria-live="polite"></div>
            <div class="map-controls">
                <button class="view selected" id="local-view">局部</button>
                <button class="view" id="network-view">全网</button>
                <button id="zoom-out" title="缩小">−</button>
                <span class="zoom-value" id="zoom-value">100%</span>
                <button id="zoom-in" title="放大">+</button>
                <button class="reset" id="zoom-reset" title="复位缩放、平移与朝向（朝向回到 90°）">复位</button>
            </div>
            <div class="heading-controls" id="heading-controls">
                <span class="ctl-label">朝向</span>
                <button type="button" id="heading-ccw" title="逆时针转 90°">−90°</button>
                <input type="number" id="heading-input" min="0" max="359" step="1" inputmode="numeric" aria-label="地图朝向度数" title="直接输入 0–359 的度数，回车应用">
                <span class="ctl-unit">°</span>
                <button type="button" id="heading-cw" title="顺时针转 90°">+90°</button>
            </div>
            <button type="button" class="sidebar-toggle" id="sidebar-toggle" title="收起右侧栏" aria-label="收起或展开右侧栏">»</button>
            <div class="layer-panel" id="layer-panel" aria-label="地图图层"></div>
            <div class="watermark">PHYSICAL GRAPH · 游戏引擎原始坐标</div>
        </section>
        <aside>
            <div class="sidebar-header">
                <div class="panel-title">车站与轨道信息</div>
                <button type="button" class="detail-back is-hidden" id="sidebar-back">← 返回全路网</button>
            </div>
            <div id="sidebar"></div>
        </aside>
    </div>
    <footer>
        <span><i class="lamp amber" id="bridge-lamp"></i>Bridge</span>
        <span><i class="lamp amber" id="live-lamp"></i>动态遥测</span>
        <span id="footer-info"></span>
        <button type="button" id="toggle-signals" hidden>隐藏信号机</button>
    </footer>
    <div id="rail-map-templates" data-template-files="templates/common.html,templates/overview-sidebar.html,templates/station-sidebar.html,templates/vehicle-sidebar.html,templates/local-station-sidebar.html" hidden aria-hidden="true"></div>
    <script src="vendor/jquery-4.0.0.min.js"></script>
    <script src="network-page.js?v=20260912-status-lamps1"></script>
    <script src="template-runtime.js?v=20260912-template-extraction1"></script>
    <script src="vendor/pixi-7.4.3.min.js"></script>
    <script src="rail-network-manifest.js?v=20260912-manifest1"></script>
    <script src="bridge-crossings.js?v=20260913-bridge-crossing21"></script>
    <script src="terrain-contour.js?v=20260930-official-palette1"></script>
    <script src="rail-graph.js?v=20260929-merge-nodes1"></script>
    <script src="network-app.js?v=20260930-stationname1"></script>
    <!-- 独立扩展图层：各自监听 window 的 'tpf2map:ready' 事件后再用 TPF2Map 接口，
         所以加载顺序不敏感，但必须排在 network-app.js 之后（它才是接口的定义方）。 -->
    <script src="station-struct.js?v=20260930-stationshape3"></script>
    <!-- 产业类型表（名字 → 类型 key）：图标层和产业链层共用一份，必须排在它俩前面 -->
    <script src="industry-kinds.js?v=20260930-kinds1"></script>
    <script src="freight-flow.js?v=20260930-recipe1"></script>
    <script src="industry-icons.js?v=20260930-kinds1"></script>
    <script src="town-layer.js?v=20260930-town1"></script>
    <script src="road-congestion.js?v=20260930-roadtraffic1"></script>
    <script src="app.js?v=20260929-street-kind1"></script>
</body>
</html>
